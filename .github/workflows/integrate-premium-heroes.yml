name: Integrate premium heroes

on:
  push:
    branches: [feat/premium-heroes]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[premium-heroes-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-heroes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply Kael and Mira integration
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function rw(f,fn){let s=fs.readFileSync(f,'utf8');s=fn(s);fs.writeFileSync(f,s)}
          rw('src/components/PixelAvatar.tsx',s=>{
            s=s.replace('export type HeroId = "nova" | "lyra";','export type HeroId = "nova" | "lyra" | "kael" | "mira";\nexport const HERO_IDS: HeroId[] = ["nova", "lyra", "kael", "mira"];\nexport function normalizeHeroId(value: unknown, fallback: HeroId = "nova"): HeroId {\n  return typeof value === "string" && HERO_IDS.includes(value as HeroId) ? value as HeroId : fallback;\n}');
            const n='  const hero = HERO[characterId];\n  const skin = "#f1bd91";';
            const r='  if (characterId === "kael" || characterId === "mira") {\n    const premiumSrc = characterId === "kael" ? "/heroes/kael.webp" : "/heroes/mira.webp";\n    const premiumName = characterId === "kael" ? "Kael" : "Mira";\n    return (\n      <div\n        className={`pixelAvatar hero-${characterId} premiumHero ${compact ? "compact" : ""} avatar-${state}`}\n        aria-label={`${label ?? premiumName} · ${state}`}\n        data-hero={characterId}\n        data-state={state}\n      >\n        <img className={`premiumHeroImage premiumSide-${side}`} src={premiumSrc} alt={label ?? premiumName} draggable={false} />\n        {label && <span>{label}</span>}\n      </div>\n    );\n  }\n\n  const hero = HERO[characterId];\n  const skin = "#f1bd91";';
            if(!s.includes(n)) throw new Error('PixelAvatar patch anchor missing');
            return s.replace(n,r);
          });
          rw('src/components/CharacterPicker.tsx',s=>{
            s=s.replace('  { id: "nova", name: "Nova", subtitle: "Tech Runner · fokus & cepat" },\n  { id: "lyra", name: "Lyra", subtitle: "Puzzle Scout · tenang & presisi" },','  { id: "nova", name: "Nova", subtitle: "Tech Runner · fokus & cepat" },\n  { id: "lyra", name: "Lyra", subtitle: "Puzzle Scout · tenang & presisi" },\n  { id: "kael", name: "Kael", subtitle: "Quantum Vanguard · berani & energik" },\n  { id: "mira", name: "Mira", subtitle: "Logic Adventurer · cermat & lincah" },');
            s=s.replace('HERO_OPTIONS.map((hero, index) =>','HERO_OPTIONS.map((hero) =>');
            s=s.replace('side={index === 0 ? "A" : "B"}','side={hero.id === "lyra" || hero.id === "mira" ? "B" : "A"}');
            return s;
          });
          ['app/host/page.tsx','app/play/[code]/page.tsx'].forEach(f=>rw(f,s=>{
            s=s.replace('import type { HeroId } from "@/src/components/PixelAvatar";','import { normalizeHeroId, type HeroId } from "@/src/components/PixelAvatar";');
            s=s.replaceAll('item.characterId==="lyra"?"lyra":"nova"','normalizeHeroId(item.characterId)');
            s=s.replaceAll('item.characterId === "lyra" ? "lyra" : "nova"','normalizeHeroId(item.characterId)');
            s=s.replaceAll('payload.characterId==="lyra"?"lyra":"nova"','normalizeHeroId(payload.characterId)');
            s=s.replaceAll('payload.characterId === "lyra" ? "lyra" : "nova"','normalizeHeroId(payload.characterId)');
            return s;
          }));
          rw('app/host/results/[code]/page.tsx',s=>{
            s=s.replace('import PixelAvatar, { type HeroId } from "@/src/components/PixelAvatar";','import PixelAvatar, { normalizeHeroId, type HeroId } from "@/src/components/PixelAvatar";');
            s=s.replaceAll('item.characterId==="lyra"?"lyra":"nova"','normalizeHeroId(item.characterId)');
            return s;
          });
          rw('app/results/[code]/page.tsx',s=>{
            s=s.replace('import PixelAvatar, { type HeroId } from "@/src/components/PixelAvatar";','import PixelAvatar, { normalizeHeroId, type HeroId } from "@/src/components/PixelAvatar";');
            s=s.replace('if (session.characterId === "lyra") setHero("lyra");','setHero(normalizeHeroId(session.characterId));');
            s=s.replace('          if (own?.characterId === "lyra") setHero("lyra");\n          else if (own?.characterId === "nova") setHero("nova");','          if (own?.characterId) setHero(normalizeHeroId(own.characterId));');
            return s;
          });
          rw('src/components/TugArena.tsx',s=>{
            const a='this.pixelPerson(170,310,1,playerACharacter);this.pixelPerson(790,310,-1,playerBCharacter);';
            const b='if(playerACharacter==="nova"||playerACharacter==="lyra")this.pixelPerson(170,310,1,playerACharacter);if(playerBCharacter==="nova"||playerBCharacter==="lyra")this.pixelPerson(790,310,-1,playerBCharacter);';
            if(!s.includes(a)) throw new Error('Tug draw patch anchor missing');
            s=s.replace(a,b);
            const c='return <div className="tugArenaWrap"><div className="tugPlayerNames" aria-hidden="true"><strong>{playerALabel}</strong><span>VS</span><strong>{playerBLabel}</strong></div><div ref={containerRef} className="phaserArena" aria-label={`Tarik tambang ${playerALabel} melawan ${playerBLabel}`}/></div>;';
            const d='return <div className="tugArenaWrap">\n    <div className="tugPlayerNames" aria-hidden="true"><strong>{playerALabel}</strong><span>VS</span><strong>{playerBLabel}</strong></div>\n    {(playerACharacter==="kael"||playerACharacter==="mira") && <img className="tugPremiumHero tugPremiumA" src={playerACharacter==="kael"?"/heroes/kael.webp":"/heroes/mira.webp"} alt={playerALabel} draggable={false}/>}\n    {(playerBCharacter==="kael"||playerBCharacter==="mira") && <img className="tugPremiumHero tugPremiumB" src={playerBCharacter==="kael"?"/heroes/kael.webp":"/heroes/mira.webp"} alt={playerBLabel} draggable={false}/>}\n    <div ref={containerRef} className="phaserArena" aria-label={`Tarik tambang ${playerALabel} melawan ${playerBLabel}`}/>\n  </div>;';
            if(!s.includes(c)) throw new Error('Tug return patch anchor missing');
            return s.replace(c,d);
          });
          rw('app/arena-v2.css',s=>s+'\n\n/* Premium UAT heroes: Kael + Mira */\n.premiumHeroImage{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;object-position:center bottom;user-select:none;pointer-events:none;filter:drop-shadow(0 10px 4px rgba(0,0,0,.28))}\n.hero-kael .premiumHeroImage{filter:drop-shadow(0 10px 4px rgba(0,0,0,.28)) drop-shadow(0 0 12px rgba(54,226,239,.14))}\n.hero-mira .premiumHeroImage{filter:drop-shadow(0 10px 4px rgba(0,0,0,.28)) drop-shadow(0 0 12px rgba(255,105,150,.14))}\n.premiumSide-B{transform:scaleX(-1)}\n.characterPreview .premiumHero{width:78px;height:110px;display:grid;place-items:end center}\n.characterPreview .premiumHeroImage{width:auto;max-width:76px;max-height:108px}\n.kartHero .premiumHeroImage{width:auto;max-height:44px}\n.resultHeroPanel .premiumHeroImage,.resultAvatarPanel .premiumHeroImage{width:auto;max-width:min(230px,90%);max-height:270px}\n.tugArenaWrap{position:relative}.tugPremiumHero{position:absolute;z-index:3;bottom:25.5%;width:clamp(58px,8vw,105px);height:31%;object-fit:contain;object-position:center bottom;pointer-events:none;user-select:none;filter:drop-shadow(0 7px 3px rgba(0,0,0,.24));animation:heroPull .42s ease-in-out infinite alternate}\n.tugPremiumA{left:12.3%}.tugPremiumB{right:12.3%;transform:scaleX(-1)}\n@media(max-width:620px){.characterPicker{grid-template-columns:repeat(2,minmax(0,1fr))}.characterCard{grid-template-columns:62px 1fr;padding:10px}.characterCard strong{font-size:15px}.characterCard span{font-size:10px}.characterPreview{width:58px;height:88px}.characterPreview .premiumHero{width:56px;height:84px}.characterPreview .premiumHeroImage{max-width:55px;max-height:82px}.tugPremiumHero{width:clamp(48px,12vw,74px)}}\n');
          fs.writeFileSync('supabase/migrations/005_extend_arena_heroes.sql',`alter table public.arena_players\n  drop constraint if exists arena_players_character_id_check;\n\nalter table public.arena_players\n  add constraint arena_players_character_id_check\n  check (character_id in ('nova', 'lyra', 'kael', 'mira'));\n\ncomment on column public.arena_players.character_id\n  is 'Selectable LevelUP Arena hero skin id (nova, lyra, kael, or mira).';\n`);
          NODE

      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          git checkout -- tsconfig.json || true
          rm -f next-env.d.ts package-lock.json tsconfig.tsbuildinfo

      - name: Commit validated integration
        shell: bash
        run: |
          rm -f .github/workflows/integrate-premium-heroes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Kael and Mira across Math Arena [premium-heroes-done]"
          git push origin HEAD:feat/premium-heroes
